# Install, lint, typecheck and build the dashboard on main and stacked PRs.
#
# pnpm, not npm: pnpm-lock.yaml is the only lockfile, and it is what Vercel
# installs from. The previous workflow ran `npm ci` against a stale
# package-lock.json and then `npm test`, a script that does not exist, so it
# could never pass. Foundation route regression tests now run before the build checks.

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # package.json engines: >=20.9.0
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:foundation
      - run: pnpm test:taxonomy
      - run: pnpm test:homepage
      - run: node --test tests/advertising.test.cjs
      - run: pnpm test:media
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
